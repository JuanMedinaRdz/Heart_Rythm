buildscript {
    repositories {
        google()  // Asegúrate de que este repositorio esté aquí
        mavenCentral()  // Incluye también Maven Central
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.0.2'  // Versión de gradle
        classpath 'com.google.gms:google-services:4.3.15' // Asegúrate de tener esta línea
    }
}


allprojects {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {

    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
