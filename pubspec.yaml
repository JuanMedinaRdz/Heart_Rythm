name: hearth_rythm
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  cloud_firestore: ^5.4.4
  firebase_core: ^3.6.0
  fl_chart: ^0.69.2
  flutter:
    sdk: flutter
  flutter_blob: ^0.0.1
  flutter_colorpicker: ^1.1.0
  flutter_launcher_icons: ^0.14.1
  go_router: ^14.2.8
  lottie: ^3.1.2
  smooth_page_indicator: ^1.2.0+3
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/src/core/assets/icon/logo2.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "lib/src/core/assets/icon/logo2.png"

flutter:
  uses-material-design: true
  assets:
    - lib/src/core/assets/images/
    - lib/src/core/assets/animations/
    - lib/src/core/assets/icon/    
